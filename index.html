<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkSocial - Social Media</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="header" style="display: none;">
        <h1>DarkSocial</h1>
        <nav>
            <a href="#" onclick="showSection('feed')">Home</a>
            <a href="#" onclick="showSection('profile')">Profile</a>
            <a href="#" onclick="showSection('friends')">Friends</a>
            <a href="#" onclick="showSection('chat')">Chat</a>
        </nav>
        <button onclick="logout()">Logout</button>
    </header>
    <main id="main" style="display: none;">
        <div id="feed">
            <div id="post-form">
                <textarea id="post-text" placeholder="What's on your mind?"></textarea>
                <input type="file" id="post-image" accept="image/*">
                <button onclick="createPost()">Post</button>
            </div>
            <div id="posts"></div>
        </div>
        <div id="sidebar">
            <h3>Friends</h3>
            <div id="friends-list"></div>
            <button onclick="addFriend()">Send Friend Request</button>
            <h3>Friend Requests</h3>
            <div id="friend-requests"></div>
        </div>
    </main>
    <div id="auth">
        <div id="login-form">
            <h2>Login</h2>
            <input id="login-username" placeholder="Username">
            <input id="login-password" type="password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p><a href="#" onclick="showSignup()">Sign Up</a></p>
        </div>
        <div id="signup-form" style="display: none;">
            <h2>Sign Up</h2>
            <input id="signup-username" placeholder="Username">
            <input id="signup-password" type="password" placeholder="Password">
            <input type="file" id="signup-profile-image" accept="image/*">
            <button onclick="signup()">Sign Up</button>
            <p><a href="#" onclick="showLogin()">Back to Login</a></p>
        </div>
    </div>
    <div id="chat">
        <h3>Chat with <span id="chat-friend"></span></h3>
        <div id="chat-messages"></div>
        <input id="chat-input" placeholder="Type a message...">
        <input type="file" id="chat-image" accept="image/*">
        <button onclick="sendMessage()">Send</button>
        <button onclick="closeChat()">Close</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
